    const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:bytes(envelope.salt), iterations:envelope.iterations, hash:'SHA-256' }, material, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    const compressed = await crypto.subtle.decrypt({ name:'AES-GCM', iv:bytes(envelope.iv), tagLength:128 }, key, bytes(envelope.ciphertext));
    const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html = await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  } catch (_) {
    status.textContent = '密码不正确，或页面数据损坏。请检查密码后重试。';
    button.disabled = false;
    input.focus();
  } finally {
    password = '';
  }
});

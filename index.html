const bytes = value => Uint8Array.from(atob(value), c => c.charCodeAt(0));
form.addEventListener('submit', async event => {
  event.preventDefault();
  if (!input.value || button.disabled) return;
  if (!window.isSecureContext || !window.crypto?.subtle || !window.DecompressionStream) {
    status.textContent = '请通过 HTTPS 网址，使用较新版本的 Chrome、Edge、Safari 或 Firefox 打开。';
    return;
  }
  let password = input.value;
  input.value = '';
  button.disabled = true;
  status.textContent = '正在解锁，请稍候…';
  try {
    const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    password = '';
    const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:bytes(envelope.salt), iterations:envelope.iterations, hash:'SHA-256' }, material, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    const compressed = await crypto.subtle.decrypt({ name:'AES-GCM', iv:bytes(envelope.iv), tagLength:128 }, key, bytes(envelope.ciphertext));
    const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html = await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  } catch (_) {
    status.textContent = '密码不正确，或页面数据损坏。请检查密码后重试。';
    button.disabled = false;
    input.focus();
  } finally {
    password = '';
  }
});
</script></body></html>
